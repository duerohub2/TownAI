<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>AI World</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>

  <!-- HUD (diisi oleh UIScene) -->
  <div id="hud" class="hidden">
    <div id="coords">x: 0  y: 0</div>
    <canvas id="minimap" width="100" height="100"></canvas>
    <div id="hint">WASD untuk gerak</div>

    <!-- Joystick virtual (dikendalikan joystick.js) -->
    <div id="joy-base"><div id="joy-knob"></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <!-- Urutan penting: data -> joystick -> scene -> config -> main -->
  <script src="map.js"></script>
  <script src="joystick.js"></script>
  <script src="scenes/PreloadScene.js"></script>
  <script src="scenes/WorldScene.js"></script>
  <script src="scenes/UIScene.js"></script>
  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
